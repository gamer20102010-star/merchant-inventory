name: Update Local Inventory Feed

on:
  schedule:
    - cron: '0 */6 * * *'  # Запускається кожні 6 годин
  workflow_dispatch:        # Дозволяє запускати вручну з вкладки Actions у будь-який момент

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run script to generate CSV
        run: python generate_feed.py

      - name: Commit and push changes if CSV updated
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add local_inventory.csv
          git diff --quiet && git diff --cached --quiet || (git commit -m "Auto-update local inventory CSV" && git push)